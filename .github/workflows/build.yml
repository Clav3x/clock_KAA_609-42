name: Build Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'          

      - name: Install MAUI
        run: dotnet workload install maui

      - name: Publish
        run: dotnet publish Clock/Clock.csproj -c Release -f net7.0-windows10.0.19041.0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clock-Windows
          path: Clock/bin/Release/ЗАМЕНИ_net7.0-windows10.0.19041.0/publish
